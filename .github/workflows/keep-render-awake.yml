name: Keep Render Awake

on:
  schedule:
    # GitHub Actions schedules use UTC. These three entries cover
    # 09:00–18:00 Asia/Kolkata (UTC+05:30), every 10 minutes.
    - cron: "30,40,50 3 * * *"
    - cron: "*/10 4-11 * * *"
    - cron: "0,10,20,30 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request the public health endpoint
        run: curl --fail --silent --show-error --location --retry 2 --max-time 30 https://invexa.onrender.com/health
