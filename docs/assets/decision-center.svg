<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Decision Center preview</title>
  <desc id="desc">A stylized decision center showing recommendation cards and AI-assisted operational explanation.</desc>
  <rect width="1200" height="675" fill="#F5F7F8"/>
  <rect x="58" y="52" width="1084" height="571" rx="18" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="96" y="105" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Decision Center</text>
  <text x="96" y="136" fill="#667386" font-family="Segoe UI, Arial, sans-serif" font-size="15">Recommendation workflow generated from warehouse intelligence signals</text>

  <rect x="96" y="184" width="316" height="360" rx="12" fill="#F7FAFC" stroke="#D9E1EA"/>
  <text x="122" y="223" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">High Priority</text>
  <rect x="122" y="255" width="246" height="10" rx="5" fill="#B84A3A"/>
  <text x="122" y="298" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Resolve stock mismatches</text>
  <text x="122" y="326" fill="#667386" font-family="Segoe UI, Arial, sans-serif" font-size="13">3 items generate elevated loss exposure.</text>
  <rect x="122" y="365" width="232" height="36" rx="8" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="142" y="388" fill="#3A4A5A" font-family="Segoe UI, Arial, sans-serif" font-size="13">Investigate Router variance</text>
  <rect x="122" y="415" width="214" height="36" rx="8" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="142" y="438" fill="#3A4A5A" font-family="Segoe UI, Arial, sans-serif" font-size="13">Review South Hub loss</text>

  <rect x="442" y="184" width="316" height="360" rx="12" fill="#F7FAFC" stroke="#D9E1EA"/>
  <text x="468" y="223" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Budget Allocation</text>
  <rect x="468" y="255" width="210" height="10" rx="5" fill="#2E6F95"/>
  <text x="468" y="298" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Execute replenishment plan</text>
  <text x="468" y="326" fill="#667386" font-family="Segoe UI, Arial, sans-serif" font-size="13">Prioritized plan fits operational budget.</text>
  <rect x="468" y="365" width="230" height="36" rx="8" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="488" y="388" fill="#3A4A5A" font-family="Segoe UI, Arial, sans-serif" font-size="13">Allocate budget to Router</text>
  <rect x="468" y="415" width="224" height="36" rx="8" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="488" y="438" fill="#3A4A5A" font-family="Segoe UI, Arial, sans-serif" font-size="13">Transfer before purchase</text>

  <rect x="788" y="184" width="288" height="360" rx="12" fill="#F2F7F5" stroke="#C8DDD4"/>
  <text x="816" y="223" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">AI Copilot</text>
  <text x="816" y="258" fill="#526270" font-family="Segoe UI, Arial, sans-serif" font-size="13">Question</text>
  <rect x="816" y="278" width="220" height="42" rx="8" fill="#FFFFFF" stroke="#C8DDD4"/>
  <text x="834" y="304" fill="#3A4A5A" font-family="Segoe UI, Arial, sans-serif" font-size="13">Which warehouse needs attention?</text>
  <text x="816" y="358" fill="#526270" font-family="Segoe UI, Arial, sans-serif" font-size="13">Answer</text>
  <text x="816" y="391" fill="#17212B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">South Hub needs attention</text>
  <text x="816" y="421" fill="#667386" font-family="Segoe UI, Arial, sans-serif" font-size="13">Health is lower due to accuracy, risk,</text>
  <text x="816" y="443" fill="#667386" font-family="Segoe UI, Arial, sans-serif" font-size="13">and capacity pressure.</text>
  <rect x="816" y="482" width="138" height="34" rx="8" fill="#2E6F95"/>
  <text x="841" y="504" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Evidence linked</text>
</svg>
